# =============================================================================
# KONFIGURASI HOST NGINX REVERSE PROXY & KEAMANAN SSL (VPS PRODUCTION)
# =============================================================================
# Letakkan berkas ini di host VPS:
# /etc/nginx/sites-available/kp-if-sakti.conf
#
# Lalu aktifkan dengan:
# sudo ln -s /etc/nginx/sites-available/kp-if-sakti.conf /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx
#
# Catatan: Ganti 'fatayat-sukabumi.org' dengan domain aktif Anda.
# =============================================================================

# Rate Limiting untuk perlindungan dari serangan Brute-Force & DDoS
limit_req_zone $binary_remote_addr zone=kp_login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=kp_api_limit:10m rate=60r/m;

# -----------------------------------------------------------------------------
# 1. SERVER BLOCK HTTP (PORT 80) -> REDIRECT KE HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fatayat-sukabumi.org www.fatayat-sukabumi.org;

    # Let's Encrypt ACME Challenge untuk pembaruan otomatis sertifikat SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect seluruh lalu lintas non-SSL ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 2. SERVER BLOCK HTTPS (PORT 443) -> REVERSE PROXY KE DOCKER CONTAINER
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fatayat-sukabumi.org www.fatayat-sukabumi.org;

    # Sembunyikan versi Nginx
    server_tokens off;

    # Path Sertifikat SSL Let's Encrypt (dihasilkan oleh Certbot)
    ssl_certificate /etc/letsencrypt/live/fatayat-sukabumi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fatayat-sukabumi.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/fatayat-sukabumi.org/chain.pem;

    # Protokol & Cipher Suite Modern dan Aman
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Header Keamanan Tingkat Tinggi (HSTS, Anti-Clickjacking, MIME Sniffing)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Batas Maksimal Upload Berkas Media (Foto Pejabat, Berkas PAC, Dokumen Laporan)
    client_max_body_size 12M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Log Akses & Error Host
    access_log /var/log/nginx/kp_access.log;
    error_log /var/log/nginx/kp_error.log warn;

    # Proteksi Halaman Login Admin dari Brute-Force (Rate Limiting)
    location = /login {
        limit_req zone=kp_login_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proteksi Endpoint API Publik dari Request Flooding
    location /api/ {
        limit_req zone=kp_api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy Utama ke Docker App (Port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
