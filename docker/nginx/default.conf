server {
    listen 80 default_server;
    server_name _;

    # Frontend static files (production build)
    root /var/www/frontend;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel API & backend routes (proxy to PHP-FPM)
    location ~ ^/(api|login|logout|csrf-token|dashboard|anggota|data-pac|kegiatan|laporan|pengaturan|backup|restore|header|up|storage) {
        root /var/www/html/public;

        # Try static files first, then pass to PHP
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # Laravel storage symlink
    location /storage {
        alias /var/www/html/storage/app/public;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Frontend SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
