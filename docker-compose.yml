services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kp_db
      MYSQL_USER: kp_user
      MYSQL_PASSWORD: kp_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ukp_user -pkp_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-assets:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - /workspace/node_modules
    command: sh -c "npm install && npm run build"

  app:
    build:
      context: .
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=kp_db
      - DB_USERNAME=kp_user
      - DB_PASSWORD=kp_password
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    depends_on:
      db:
        condition: service_healthy
      backend-assets:
        condition: service_completed_successfully

  node:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    ports:
      - "5173:5173"
    environment:
      # Saat berjalan di Docker, API di-proxy ke service "app"
      - VITE_API_TARGET=http://app:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

volumes:
  db_data:
