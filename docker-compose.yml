version: '3.8'
services:
  app:
    image: php:8.2-fpm
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "9000:9000"
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kp_db
    ports:
      - "3306:3306"
  node:
    image: node:18
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
    command: tail -f /dev/null
